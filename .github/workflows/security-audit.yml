# .github/workflows/security-audit.yml
name: Security Vulnerability Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-vulnerability-check:
    name: Backend Go Security Audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go Vulnerability Scanner
        working-directory: ./backend
        run: govulncheck ./...

  frontend-vulnerability-check:
    name: Frontend Node Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high