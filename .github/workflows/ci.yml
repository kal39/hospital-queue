name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. BACKEND JOB: Go validation and testing
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Matches your project compilation version

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Go Build (Compilation Check)
        run: go build ./...

      - name: Run Backend Tests
        run: go test -v ./...

  # 2. FRONTEND JOB: Next.js build and linting
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Lint Check)
        run: npm run lint

      - name: Run Production Build (Compilation Check)
        run: npm run build